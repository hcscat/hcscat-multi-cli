name: Windows build and VSIX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Review public source privacy
        run: npm run check:privacy
      - name: Package Windows x64 VSIX
        run: npm run package
      - name: Save VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-cli-win32-x64-${{ github.sha }}
          path: |
            release/**/*.vsix
            release/**/*.vsix.sha256
          if-no-files-found: error
          retention-days: 14
